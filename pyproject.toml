[project]
name = "onek1k-bcell-aging"
version = "0.1.0"
description = "Donor-level B-cell aging analyses for the OneK1K cohort"
requires-python = ">=3.10,<3.12"
dependencies = [
  "adjustText>=1.1,<2",
  "anndata==0.10.9",
  "gseapy==1.3.1",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "pydeseq2==0.4.12",
  "scipy>=1.11,<2",
  "zarr<3",
]

[project.optional-dependencies]
full = [
  "decoupler==1.9.2",
  "networkx>=3.2,<4",
  "patsy>=0.5,<2",
  "scikit-learn>=1.3,<2",
  "statsmodels>=0.14,<1",
]

[tool.uv]
package = false
